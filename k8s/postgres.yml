apiVersion: v1
kind: Secret
metadata:
  name: moviesbymood-postgres-secret
  namespace: kotlov20260516
type: Opaque
stringData:
  POSTGRES_DB: moodmovies
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: kotlov20260516
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moviesbymood-postgres
  namespace: kotlov20260516
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moviesbymood-postgres
  template:
    metadata:
      labels:
        app: moviesbymood-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: moviesbymood-postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U postgres -d moodmovies
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data

---
apiVersion: v1
kind: Service
metadata:
  name: moviesbymood-postgres
  namespace: kotlov20260516
spec:
  selector:
    app: moviesbymood-postgres
  ports:
    - port: 5432
      targetPort: 5432
