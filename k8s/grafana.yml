apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: kotlov20260516
data:
  datasource.yml: |
    apiVersion: 1

    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://moviesbymood-loki:3100
        isDefault: true
        editable: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moviesbymood-grafana
  namespace: kotlov20260516
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moviesbymood-grafana
  template:
    metadata:
      labels:
        app: moviesbymood-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.5
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource

---
apiVersion: v1
kind: Service
metadata:
  name: moviesbymood-grafana
  namespace: kotlov20260516
spec:
  selector:
    app: moviesbymood-grafana
  ports:
    - port: 3000
      targetPort: 3000
