<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Каталог фильмов</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"/>

    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
          rel="stylesheet"/>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
          rel="stylesheet"/>

    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/movies}">MoviesByMood</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNavbar" aria-controls="mainNavbar"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${activeTab=='movies'} ? ' active' : ''"
                       th:href="@{/movies}">Фильмы</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${activeTab=='moods'} ? ' active' : ''"
                       th:href="@{/moods}">Настроения</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${activeTab=='profile'} ? ' active' : ''"
                       th:href="@{/profile}">Мой профиль</a>
                </li>
                <li class="nav-item" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                    <a class="btn btn-outline-secondary ms-2" th:href="@{/admin/movies}">Админка</a>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline ms-2">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>
                        <button class="btn btn-outline-secondary">Выйти</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4">

    <form method="get" th:action="@{/movies}">
        <div class="row gy-3 gx-3 align-items-end">
            <div class="col-12 col-md-4">
                <label for="titleInput" class="form-label">По названию</label>
                <input type="text"
                       id="titleInput"
                       name="movieTitle"
                       th:value="${filterTitle}"
                       class="form-control"
                       placeholder="Начните вводить название..."/>
            </div>

            <div class="col-6 col-md-2">
                <label for="durationInput" class="form-label">Длительность (мин)</label>
                <input type="number"
                       id="durationInput"
                       name="duration"
                       th:value="${filterDuration}"
                       class="form-control"
                       placeholder="Время"/>
            </div>

            <div class="col-6 col-md-2">
                <label for="radiusInput" class="form-label">Радиус (± мин)</label>
                <input type="number"
                       id="radiusInput"
                       name="durationRadius"
                       th:value="${filterDurationRadius}"
                       class="form-control"
                       placeholder="Радиус"/>
            </div>

            <div class="col-6 col-md-2">
                <label for="ratingSort" class="form-label">Сортировка по рейтингу</label>
                <select id="ratingSort"
                        name="ratingSort"
                        class="form-select">
                    <option value=""    th:selected="${ratingSort==''}">Без сортировки</option>
                    <option value="desc" th:selected="${ratingSort=='desc'}">По убыванию</option>
                    <option value="asc"  th:selected="${ratingSort=='asc'}">По возрастанию</option>
                </select>
            </div>

            <div class="col-6 col-md-2 text-end">
                <button type="submit" class="btn btn-primary w-100">Найти</button>
            </div>
        </div>

        <div class="row gy-3 gx-3 align-items-end mt-3">
            <div class="col-6 col-md-3">
                <label for="moodSelect" class="form-label">Настроение</label>
                <select id="moodSelect" name="mood" class="form-select">
                    <option value="">Все</option>
                    <option th:each="m : ${allMoods}"
                            th:value="${m.moodId}"
                            th:text="${m.moodName}"
                            th:selected="${filterMood} == ${m.moodId}"/>
                </select>
            </div>
            <div class="col-6 col-md-3">
                <label for="genreSelect" class="form-label">Жанр</label>
                <select id="genreSelect" name="genre" class="form-select">
                    <option value="">Все</option>
                    <option th:each="g : ${allGenres}"
                            th:value="${g.genreId}"
                            th:text="${g.genreName}"
                            th:selected="${filterGenre} == ${g.genreId}"/>
                </select>
            </div>
            <div class="col-6 col-md-3">
                <label for="actorSelect" class="form-label">Актёр</label>
                <select id="actorSelect" name="actor" class="form-select">
                    <option value="">Все</option>
                    <option th:each="a : ${allActors}"
                            th:value="${a.actorId}"
                            th:text="${a.actorFullName}"
                            th:selected="${filterActor} == ${a.actorId}"/>
                </select>
            </div>
            <div class="col-6 col-md-3">
                <label for="directorSelect" class="form-label">Режиссёр</label>
                <select id="directorSelect" name="director" class="form-select">
                    <option value="">Все</option>
                    <option th:each="d : ${allDirectors}"
                            th:value="${d.directorId}"
                            th:text="${d.directorFullName}"
                            th:selected="${filterDirector} == ${d.directorId}"/>
                </select>
            </div>
        </div>
    </form>

    <div th:fragment="moviesList" class="mt-4">
        <div th:if="${#lists.isEmpty(movies)}">
            <p class="text-muted">Ничего не найдено.</p>
        </div>
        <div id="moviesGrid"
             class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4"
             th:if="${!#lists.isEmpty(movies)}">

            <div class="col movie-row" th:each="m : ${movies}">
                <div class="card h-100 position-relative">
                    <img th:if="${m.moviePoster != null}"
                         th:src="@{${m.moviePoster}}"
                         class="img-fluid img-scale-60 mb-3"
                         alt="Постер"/>
                    <img th:if="${m.moviePoster == null}"
                         th:src="@{/images/default-movie.png}"
                         class="img-fluid img-scale-60 mb-3"
                         alt="Нет постера"/>

                    <button type="button"
                            class="btn position-absolute top-0 end-0 m-2 p-1"
                            th:classappend="${userFavorites.contains(m.movieId)} ? ' btn-danger' : ' btn-light'"
                            th:data-movie-id="${m.movieId}"
                            onclick="toggleFavorite(this)">
                        <i class="fas fa-heart"></i>
                    </button>

                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title movie-title" th:text="${m.movieTitle}">Название</h5>
                        <p class="card-text text-muted mb-3">
                            <span th:text="${#temporals.format(m.movieReleaseDate,'yyyy')}">Год</span>,
                            <span class="movie-duration" th:text="${m.movieDuration}">00</span> мин.
                            <span th:text="${m.movieAverageRating != null ? #numbers.formatDecimal(m.movieAverageRating, 1, 1) : '—'}">0.0</span>
                        </p>
                        <a th:href="@{/movies/{id}(id=${m.movieId})}"
                           class="btn btn-primary mt-auto">Подробнее</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script th:inline="javascript">
    $(function(){
        $('#moodSelect, #genreSelect, #actorSelect, #directorSelect').select2({
            placeholder: 'Все',
            allowClear: true,
            width: '100%'
        });
    });

    function filterMovies() {
        const oldMsg = document.getElementById('noMovieFound');
        if (oldMsg) oldMsg.remove();

        const titleFilter = document.getElementById('titleInput').value.trim().toLowerCase();
        const durationCenter = parseInt(document.getElementById('durationInput').value);
        const durationRadius = parseInt(document.getElementById('radiusInput').value);
        let foundAny = false;

        document.querySelectorAll('#moviesGrid .movie-row').forEach(row => {
            const title = row.querySelector('.movie-title').textContent.trim().toLowerCase();
            const durElem = row.querySelector('.movie-duration');
            const duration = durElem ? parseInt(durElem.textContent.trim()) : NaN;

            const matchTitle = !titleFilter || title.includes(titleFilter);
            let matchDuration = true;
            if (!isNaN(durationCenter) && !isNaN(durationRadius) && !isNaN(duration)) {
                matchDuration =
                    duration >= (durationCenter - durationRadius) &&
                    duration <= (durationCenter + durationRadius);
            }

            if (matchTitle && matchDuration) {
                row.style.display = '';
                foundAny = true;
            } else {
                row.style.display = 'none';
            }
        });

        if (!foundAny) {
            const grid = document.getElementById('moviesGrid');
            const div = document.createElement('div');
            div.id = 'noMovieFound';
            div.className = 'text-center text-muted w-100 mt-4';
            div.textContent = 'Ничего не найдено.';
            grid.append(div);
        }
    }

    document.getElementById('titleInput').addEventListener('input', filterMovies);
    document.getElementById('durationInput').addEventListener('input', filterMovies);
    document.getElementById('radiusInput').addEventListener('input', filterMovies);

    document.getElementById('titleInput').addEventListener('input', filterMovies);
    document.getElementById('durationInput').addEventListener('input', filterMovies);
    document.getElementById('radiusInput').addEventListener('input', filterMovies);

    function toggleFavorite(btn) {
        const id     = btn.getAttribute('data-movie-id');
        const token  = /*[[${_csrf.token}]]*/ '';
        const header = /*[[${_csrf.headerName}]]*/ '';
        fetch(`/movies/${id}/favorite`, {
            method: 'POST',
            headers: { [header]: token }
        })
            .then(resp => {
                if (resp.ok) {
                    location.reload();
                } else {
                    alert('Не удалось обновить избранное');
                }
            })
            .catch(err => {
                console.error('Ошибка при запросе:', err);
                alert('Ошибка сети');
            });
    }
</script>
</body>
</html>
