<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${actor.actorFullName}">Актёр</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<nav class="navbar navbar-light bg-light mb-4">
    <div class="container">
        <button class="btn btn-outline-secondary" onclick="history.back()">
            ← Назад
        </button>
    </div>
</nav>

<div class="container py-4">
    <div class="card">
        <div class="row g-0">
            <div class="col-md-4 text-center p-3">
                <img th:if="${actor.actorPhoto != null}"
                     th:src="@{${actor.actorPhoto}}"
                     class="img-fluid rounded"
                     style="max-width:200px;"
                     alt="Фото актёра"/>
                <img th:if="${actor.actorPhoto == null}"
                     th:src="@{/images/default-actor.png}"
                     class="img-fluid rounded"
                     style="max-width:200px;"
                     alt="Нет фото"/>
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <h1 class="card-title" th:text="${actor.actorFullName}">Имя актёра</h1>
                    <p class="card-text">
                        <strong>Дата рождения:</strong>
                        <span th:text="${actor.actorBirthDate != null
                          ? #temporals.format(actor.actorBirthDate,'dd.MM.yyyy')
                          : '—'}">01.01.1970</span>
                    </p>
                    <h5>Биография</h5>
                    <p class="card-text"
                       th:utext="${actor.actorBiography != null
                          ? actor.actorBiography
                          : 'Биография отсутствует.'}">
                        Здесь будет текст биографии…
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
