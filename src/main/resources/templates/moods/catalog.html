<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Каталог настроений</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/movies}">MoviesByMood</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a class="nav-link"
                   th:classappend="${activeTab=='movies'} ? ' active' : ''"
                   th:href="@{/movies}">Фильмы</a>
            </li>
            <li class="nav-item">
                <a class="nav-link"
                   th:classappend="${activeTab=='moods'} ? ' active' : ''"
                   th:href="@{/moods}">Настроения</a>
            </li>
            <li class="nav-item">
                <a class="nav-link"
                   th:classappend="${activeTab=='profile'} ? ' active' : ''"
                   th:href="@{/profile}">Мой профиль</a>
            </li>
            <li class="nav-item" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                <a class="btn btn-outline-secondary ms-2" th:href="@{/admin/movies}">Админка</a>
            </li>
            <li class="nav-item">
                <form th:action="@{/logout}" method="post" class="d-inline ms-2">
                    <input type="hidden" th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>
                    <button class="btn btn-outline-secondary">Выйти</button>
                </form>
            </li>
        </ul>
    </div>
</nav>

<div class="container">

    <div th:if="${#authentication.principal != null}" class="mb-4">
        <a th:href="@{/playlists}"
           class="btn btn-outline-primary">
            <i class="fas fa-list"></i> Ваши плейлисты
        </a>
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        <div class="col" th:each="m : ${moods}">
            <div class="card h-100 position-relative mood-card">

                <img th:if="${m.iconFilename != null}"
                     th:src="@{/files/{fn}(fn=${m.iconFilename})}"
                     class="img-fluid img-scale-60 mb-3"
                     alt="Иконка настроения"/>
                <img th:if="${m.iconFilename == null}"
                     th:src="@{/images/default-mood.png}"
                     class="img-fluid img-scale-60 mb-3"
                     alt="Нет иконки"/>

                <div class="card-body">
                    <h5 class="card-title" th:text="${m.moodName}">Название</h5>
                    <p class="card-text" th:text="${m.moodDescription}">Описание</p>
                    <a th:href="@{/moods/{id}(id=${m.moodId})}"
                       class="btn btn-primary">Подробнее</a>
                </div>

                <button type="button"
                        class="btn position-absolute top-0 end-0 m-2 p-1"
                        th:classappend="${userFavoriteMoodIds.contains(m.moodId)} ? 'btn-danger' : 'btn-light'"
                        th:data-mood-id="${m.moodId}"
                        onclick="toggleFavoriteMood(this)">
                    <i class="fas fa-heart"></i>
                </button>
            </div>
        </div>
    </div>


    <div th:if="${#lists.isEmpty(moods)}" class="mt-4">
        <div class="alert alert-info">Пока нет настроений.</div>
    </div>

</div>

<script th:inline="javascript">
    function toggleFavoriteMood(btn) {
        const id     = btn.getAttribute('data-mood-id');
        const token  = /*[[${_csrf.token}]]*/ '';
        const header = /*[[${_csrf.headerName}]]*/ '';
        fetch(`/moods/${id}/favorite`, {
            method: 'POST',
            headers: { [header]: token }
        }).then(r => { if (r.ok) location.reload(); });
    }
</script>
</body>
</html>
