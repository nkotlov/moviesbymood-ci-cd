<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Новый плейлист</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"/>
</head>
<body>
<nav class="navbar navbar-light bg-light mb-4">
    <div class="container">
        <a class="btn btn-outline-secondary" th:href="@{/playlists}">← Назад</a>
    </div>
</nav>

<div class="container">
    <h1>Новый плейлист</h1>
    <form th:action="@{/playlists}"
          th:object="${createRequest}"
          method="post"
          enctype="multipart/form-data"
          class="needs-validation"
          novalidate>

        <div class="mb-3">
            <label for="playlistName" class="form-label">Название<span class="text-danger">*</span></label>
            <input type="text"
                   id="playlistName"
                   th:field="*{playlistName}"
                   class="form-control"
                   required/>
            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('playlistName')}"
                 th:errors="*{playlistName}">Обязательное поле</div>
        </div>

        <div class="mb-3">
            <label for="posterFile" class="form-label">
                Постер плейлиста<span class="text-danger">*</span>
            </label>
            <div class="mb-2">
                <img id="posterPreview"
                     th:src="@{/images/playlist-default.png}"
                     class="img-thumbnail mb-2 rounded"
                     style="max-width:200px;"
                     alt="Превью постера"/>
            </div>
            <input type="file"
                   id="posterFile"
                   name="posterFile"
                   accept="image/*"
                   class="form-control d-none"
                   required
                   onchange="onPosterSelected(this)"/>
            <label for="posterFile"
                   class="btn btn-outline-primary">
                Выбрать постер
            </label>
            <div class="invalid-feedback">
                Пожалуйста, добавьте изображение постера.
            </div>
        </div>

        <div class="mb-3">
            <label for="movieSearch" class="form-label">Поиск фильма</label>
            <input type="text"
                   id="movieSearch"
                   class="form-control"
                   placeholder="Введите часть названия..."
                   onkeyup="filterMovies()"/>
        </div>

        <div class="table-responsive mb-4" style="max-height:400px; overflow-y:auto">
            <table class="table table-hover" id="moviesTable">
                <thead class="table-light">
                <tr>
                    <th>Название</th>
                    <th>Год</th>
                    <th class="text-center">Добавить/убрать</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${allMovies}" class="movie-row">
                    <td class="movie-title"
                        th:text="${m.movieTitle}">Фильм</td>
                    <td th:text="${m.movieReleaseDate != null ? #temporals.format(m.movieReleaseDate,'yyyy') : '-'}">
                        Год
                    </td>
                    <td class="text-center">
                        <button type="button"
                                class="btn btn-sm btn-outline-primary"
                                th:attr="data-movie-id=${m.movieId}"
                                onclick="toggleMovie(this)">
                            Добавить
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <button class="btn btn-primary">Создать</button>
        <a th:href="@{/moods}" class="btn btn-secondary ms-2">Отмена</a>
    </form>
</div>

<script th:inline="javascript">
    function onPosterSelected(input) {
        const file = input.files[0];
        const preview = document.getElementById('posterPreview');
        if (file) {
            const reader = new FileReader();
            reader.onload = e => {
                preview.src = e.target.result;
            };
            reader.readAsDataURL(file);
        } else {
            preview.src = /*[[ @{/images/playlist-default.png} ]]*/ '';
        }
    }

    const selected = new Set();

    function filterMovies() {
        const f = document.getElementById('movieSearch').value.toLowerCase();
        document.querySelectorAll('.movie-row').forEach(r => {
            r.style.display =
                r.querySelector('.movie-title').textContent.toLowerCase().includes(f)
                    ? ''
                    : 'none';
        });
    }

    function toggleMovie(btn) {
        const id        = btn.getAttribute('data-movie-id');
        const row       = btn.closest('tr');
        const container = document.getElementById('selectedMoviesInputs');

        if (selected.has(id)) {
            selected.delete(id);
            row.classList.remove('selected-row');
            btn.classList.remove('btn-remove');
            btn.classList.replace('btn-outline-danger','btn-outline-primary');
            btn.textContent = 'Добавить';
            container.querySelector(`input[value="${id}"]`)?.remove();
        } else {
            selected.add(id);
            row.classList.add('selected-row');
            btn.classList.replace('btn-outline-primary','btn-outline-danger');
            btn.classList.add('btn-remove');
            btn.textContent = 'Убрать';
            const inp = document.createElement('input');
            inp.type  = 'hidden';
            inp.name  = 'movieIds';
            inp.value = id;
            container.appendChild(inp);
        }
    }

    document.querySelectorAll('.needs-validation').forEach(form =>
        form.addEventListener('submit', e => {
            if (!form.checkValidity()) {
                e.preventDefault();
                e.stopPropagation();
            }
            form.classList.add('was-validated');
        })
    );
</script>
</body>
</html>
