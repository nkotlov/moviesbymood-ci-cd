<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Мои плейлисты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body>

<nav class="navbar navbar-light bg-light mb-4">
    <div class="container">
        <a class="btn btn-outline-secondary" th:href="@{/moods}">← Назад</a>
    </div>
</nav>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Мои плейлисты</h1>
        <a th:href="@{/playlists/new}" class="btn btn-success">
            <i class="fas fa-plus-circle"></i> Создать новый
        </a>
    </div>

    <div th:if="${#lists.isEmpty(userPlaylists)}" class="alert alert-info">
        У вас пока нет плейлистов.
    </div>

    <ul class="list-group" th:if="${!#lists.isEmpty(userPlaylists)}">
        <li class="list-group-item d-flex justify-content-between align-items-center mb-2"
            th:each="pl : ${userPlaylists}">

            <div>
                <a th:href="@{/playlists/{id}(id=${pl.playlistId})}"
                   th:text="${pl.playlistName}">Название плейлиста</a>
                <small class="text-muted ms-2"
                       th:text="${#temporals.format(pl.playlistCreatedAt,'dd.MM.yyyy HH:mm')}">
                    Дата создания
                </small>
            </div>

            <div>
                <a th:href="@{/playlists/{id}/edit(id=${pl.playlistId})}"
                   class="btn btn-sm btn-outline-secondary me-1"
                   title="Редактировать">
                    <i class="fas fa-edit"></i>
                </a>
                <form th:action="@{/playlists/{id}/delete(id=${pl.playlistId})}"
                      method="post"
                      class="d-inline"
                      onsubmit="return confirm('Удалить плейлист «' + /*[[${pl.playlistName}]]*/ '' + '»?');">
                    <input type="hidden" th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>
                    <button type="submit"
                            class="btn btn-sm btn-outline-danger"
                            title="Удалить">
                        <i class="fas fa-trash"></i>
                    </button>
                </form>
            </div>
        </li>
    </ul>

</div>

</body>
</html>
