<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${directorDto.directorId} == null
                 ? 'Добавить режиссёра'
                 : 'Редактировать режиссёра'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div class="container py-4">
    <button class="btn btn-outline-secondary mb-3" onclick="history.back()">← Назад</button>
    <h1 th:text="${directorDto.directorId} == null
                ? 'Добавить режиссёра'
                : 'Редактировать режиссёра'"></h1>

    <form th:action="${directorDto.directorId} == null
                   ? @{/admin/directors}
                   : @{/admin/directors/{id}(id=${directorDto.directorId})}"
          th:object="${directorDto}"
          method="post" enctype="multipart/form-data"
          class="needs-validation" novalidate>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label for="directorFullName" class="form-label">
                ФИО <span class="text-danger">*</span>
            </label>
            <input type="text" id="directorFullName" th:field="*{directorFullName}"
                   class="form-control" required/>
            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('directorFullName')}"
                 th:errors="*{directorFullName}"></div>
        </div>

        <div class="mb-3">
            <label for="directorBirthDate" class="form-label">Дата рождения</label>
            <input type="date" id="directorBirthDate" th:field="*{directorBirthDate}"
                   class="form-control"/>
        </div>

        <div class="mb-3">
            <label for="directorBiography" class="form-label">Биография</label>
            <textarea id="directorBiography" th:field="*{directorBiography}"
                      class="form-control" rows="4"></textarea>
        </div>

        <div th:if="${directorDto.directorPhoto != null}" class="mb-3">
            <label class="form-label">Текущее фото</label>
            <div>
                <img th:src="@{${directorDto.directorPhoto}}"
                     class="img-thumbnail mb-2" style="max-width:200px;"
                     alt="Фото режиссёра"/>
            </div>
        </div>

        <div class="mb-4">
            <label for="photoFile" class="form-label">Загрузить фото</label>
            <input type="file" id="photoFile" name="photoFile" accept="image/*"
                   class="form-control"/>
            <div class="form-text">Если не выбрать — останется прежнее.</div>
        </div>

        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a th:href="@{/admin?tab=directors}" class="btn btn-secondary ms-2">Отмена</a>
    </form>
</div>

<script>
    (() => {
        'use strict';
        document.querySelectorAll('.needs-validation').forEach(form => {
            form.addEventListener('submit', e => {
                if (!form.checkValidity()) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>
</body>
</html>
