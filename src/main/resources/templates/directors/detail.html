<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${director.directorFullName}">Режиссёр</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<nav class="navbar navbar-light bg-light mb-4">
    <div class="container">
        <button class="btn btn-outline-secondary" onclick="history.back()">
            ← Назад
        </button>
    </div>
</nav>

<div class="container py-4">
    <div class="card">
        <div class="row g-0">
            <div class="col-md-4 text-center p-3">
                <img th:if="${director.directorPhoto != null}"
                     th:src="@{${director.directorPhoto}}"
                     class="img-fluid rounded"
                     style="max-width:200px;"
                     alt="Фото режиссёра"/>
                <img th:if="${director.directorPhoto == null}"
                     th:src="@{/images/default-director.png}"
                     class="img-fluid rounded"
                     style="max-width:200px;"
                     alt="Нет фото"/>
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <h1 class="card-title" th:text="${director.directorFullName}">Имя режиссёра</h1>
                    <p class="card-text">
                        <strong>Дата рождения:</strong>
                        <span th:text="${director.directorBirthDate != null
                          ? #temporals.format(director.directorBirthDate,'dd.MM.yyyy')
                          : '—'}">01.01.1970</span>
                    </p>
                    <h5>Биография</h5>
                    <p class="card-text"
                       th:utext="${director.directorBiography != null
                          ? director.directorBiography
                          : 'Биография отсутствует.'}">
                        Здесь будет текст биографии…
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
