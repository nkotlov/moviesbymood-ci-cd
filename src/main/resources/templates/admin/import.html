<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Импорт из OMDb</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
</head>
<body>
<div class="container mt-4">
    <h1>Импорт фильма из OMDb</h1>
    <form th:action="@{/admin/import}" method="post" class="mt-3">
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div class="mb-3">
            <label for="title" class="form-label">Название фильма</label>
            <input id="title" name="title" type="text"
                   th:value="${title}" class="form-control" required/>
        </div>
        <button type="submit" class="btn btn-primary">Импортировать</button>
        <a th:href="@{/admin?tab=movies}" class="btn btn-secondary ms-2">Отмена</a>
    </form>
</div>
</body>
</html>
