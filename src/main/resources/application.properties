spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/moodmovies}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your_mail_app_password}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.allow8bitmime=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.debug=false

google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:your_google_client_id}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:your_google_client_secret}
google.oauth.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8081/oauth2/callback/google}
google.oauth.auth-url=https://accounts.google.com/o/oauth2/v2/auth
google.oauth.token-url=https://oauth2.googleapis.com/token
google.oauth.scope=openid email profile

textrazor.api.key=${TEXTRAZOR_API_KEY:your_textrazor_api_key}
mood.id.positive=1
mood.id.negative=2
mood.id.neutral=3

omdb.api.key=${OMDB_API_KEY:your_omdb_api_key}
omdb.api.url=http://www.omdbapi.com/

spring.web.resources.add-mappings=false
spring.mvc.dispatcher-servlet.throw-exception-if-no-handler-found=true

storage.path=${STORAGE_PATH:/app/files}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.confirm.url=${APP_CONFIRM_URL:http://localhost:8081/confirm}
server.port=${SERVER_PORT:8081}